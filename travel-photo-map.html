<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Photography Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }

    header {
      padding: 24px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
    }

    header a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #2563eb;
    }

    #map {
      height: 80vh;
      width: 100%;
    }

    .leaflet-popup-content {
      width: 250px;
    }

    .popup-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .popup-card h3 {
      margin: 8px 0 4px;
      font-size: 1rem;
    }

    .popup-card p {
      margin: 0;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>Suvra's World Photography Map</h1>
  <a href="index.html">← Back to Home</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  const locations = [
    {
      city: 'Berlin',
      country: 'Germany',
      coords: [52.52, 13.405],
      image: 'images/Berlin.jpg',
      text: 'Urban lines, winter light, and street textures from Berlin.'
    },
    {
      city: 'Paris',
      country: 'France',
      coords: [48.8566, 2.3522],
      image: 'images/paris.jpg',
      text: 'Architecture, reflections, and quiet city moments in Paris.'
    },
    {
      city: 'Tokyo',
      country: 'Japan',
      coords: [35.6762, 139.6503],
      image: 'images/tokyo.jpg',
      text: 'Neon, rhythm, and layered city scenes from Tokyo.'
    },
    {
      city: 'New York',
      country: 'USA',
      coords: [40.7128, -74.006],
      image: 'images/newyork.jpg',
      text: 'Motion, geometry, and energy captured in New York.'
    }
  ];

  locations.forEach(loc => {
    const popupHTML = `
      <div class="popup-card">
        <img src="${loc.image}" />
        <h3>${loc.city}, ${loc.country}</h3>
        <p>${loc.text}</p>
      </div>
    `;

    L.marker(loc.coords)
      .addTo(map)
      .bindPopup(popupHTML);
  });

  // Basic test
  console.assert(locations.length > 0, "Locations should not be empty");
</script>

</body>
</html>
