<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="An interactive map of travel photography by Suvra Nath." />
  <title>Suvra's Moment of Zen | Suvra Nath</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --ink:#1f1f1f; --paper:#f8f7f4; --muted:#666; --accent:#2f5d73; --line:#e7e4de; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; }
    body { overflow:hidden; background:var(--paper); color:var(--ink); font-family:Inter,Arial,sans-serif; }
    .map-header { position:absolute; z-index:1000; top:16px; left:16px; width:min(310px,calc(100% - 32px)); padding:18px 19px; background:rgba(248,247,244,.92); border:1px solid rgba(255,255,255,.78); border-radius:12px; box-shadow:0 10px 32px rgba(16,28,34,.15); backdrop-filter:blur(12px); }
    .eyebrow { margin:0 0 7px; color:var(--accent); font-size:.62rem; font-weight:700; letter-spacing:.11em; text-transform:uppercase; }
    h1 { margin:0; font-size:1.55rem; line-height:1.08; letter-spacing:-.04em; }
    .intro { margin:10px 0 13px; color:var(--muted); font-size:.78rem; line-height:1.45; }
    .header-row { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .back { color:var(--ink); font-size:.73rem; font-weight:600; text-decoration:none; }
    .back:hover { color:var(--accent); }
    .count { color:var(--muted); font-size:.68rem; }
    #map { width:100%; height:100%; background:#dce5e8; }
    .leaflet-control-layers,.leaflet-control-zoom { border:0!important; box-shadow:0 8px 24px rgba(16,28,34,.16)!important; }
    .leaflet-control-layers { border-radius:10px!important; }
    .leaflet-bar a { color:var(--ink); border:0!important; }
    .leaflet-popup-content-wrapper { padding:0; overflow:hidden; border-radius:14px; box-shadow:0 18px 45px rgba(15,25,30,.25); }
    .leaflet-popup-content { width:290px!important; margin:0; }
    .leaflet-popup-tip { box-shadow:none; }
    .photo-card img { display:block; width:100%; height:185px; object-fit:cover; background:#e8e8e4; }
    .photo-copy { padding:16px 17px 18px; }
    .photo-copy small { color:var(--accent); font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    .photo-copy h2 { margin:5px 0 7px; font-size:1.15rem; letter-spacing:-.025em; }
    .photo-copy p { margin:0; color:var(--muted); font-size:.82rem; line-height:1.5; }
    .photo-marker { width:50px; height:50px; padding:3px; overflow:hidden; background:#fff; border:2px solid #fff; border-radius:50%; box-shadow:0 6px 20px rgba(11,27,34,.35); transition:transform .2s ease; }
    .photo-marker:hover { transform:scale(1.12); }
    .photo-marker img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .leaflet-control-attribution { background:rgba(255,255,255,.76)!important; }
    @media(max-width:680px){ .map-header{top:10px;left:10px;width:min(270px,calc(100% - 20px));padding:14px 15px}.map-header h1{font-size:1.3rem}.intro{display:none}.header-row{margin-top:10px}.leaflet-top.leaflet-right{top:112px}.leaflet-popup-content{width:250px!important}.photo-card img{height:155px} }
  </style>
</head>
<body>
  <header class="map-header">
    <p class="eyebrow">Beyond research</p>
    <h1>Suvra's Moment of Zen</h1>
    <p class="intro">A visual journal of places, people, mountains, and moments collected along the way.</p>
    <div class="header-row"><a class="back" href="about.html">← Back to About</a><span class="count" id="photoCount"></span></div>
  </header>
  <main id="map" aria-label="Interactive world map showing travel photographs"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const places = [
      {
        city: 'Berlin', country: 'Germany', coordinates: [52.52, 13.405],
        image: 'images/Berlin.jpg',
        alt: 'A cup of coffee in a bright Berlin café',
        story: 'Everyday warmth, quiet corners, and the small rituals that make a city feel familiar.'
      }
      // Add future photographs here: { city, country, coordinates, image, alt, story }
    ];

    const map = L.map('map', { zoomControl:false, minZoom:2, worldCopyJump:true }).setView([32, 12], 3);
    L.control.zoom({ position:'bottomright' }).addTo(map);

    const street = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      subdomains:'abcd', maxZoom:20,
      attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
    });
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:19, attribution:'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics'
    }).addTo(map);
    L.control.layers({ 'Satellite':satellite, 'Detailed street map':street }, null, { position:'topright', collapsed:true }).addTo(map);

    places.forEach(place => {
      const icon = L.divIcon({
        className:'', iconSize:[50,50], iconAnchor:[25,25], popupAnchor:[0,-24],
        html:`<div class="photo-marker"><img src="${place.image}" alt="" /></div>`
      });
      const popup = `<article class="photo-card"><img src="${place.image}" alt="${place.alt}" /><div class="photo-copy"><small>${place.country}</small><h2>${place.city}</h2><p>${place.story}</p></div></article>`;
      L.marker(place.coordinates,{icon}).addTo(map).bindPopup(popup,{maxWidth:290});
    });

    document.getElementById('photoCount').textContent = `${places.length} photo location${places.length === 1 ? '' : 's'}`;
  </script>
</body>
</html>
